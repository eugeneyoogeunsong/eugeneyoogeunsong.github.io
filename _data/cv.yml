    Experience:
      - company: Imperial College London
        position: Graduate Researcher
        location: "London Area,<br>United Kingdom"
        start_date: 2026
        highlights:
          - "I work on neutrino interactions, oscillations, detector analysis, and ML reconstruction techniques with Fermilab's (American) flagship collaborations — DUNE (Deep Underground Neutrino Experiment) and NOvA (NuMI Off-axis νe Appearance) programs — under the supervision of Dr Linda Cremonesi. On NOvA I work on a variety of physics analyses."

      - company: Imperial College London
        position: Graduate Researcher
        location: "London Area,<br>United Kingdom"
        start_date: 2025-06
        highlights:
          - "I'm conducting cross-disciplinary research by fusing particle physics-style modelling, Machine Learning (ML), and bioengineering to decode atrial fibrillation (Afib), using spatiotemporal reconstruction and data-driven simulations to map Afib wave dynamics and reveal the underlying electrical mechanisms. To do so, my primary focus has been on utilising and implementing various Physics-Informed Neural Networks (PINN) and to architect my own framework."
          - "For my current PINN research project, I'm collaborating with Prof. David Colling (Imperial HEP group) and Dr. Nick Linton (Imperial Department of Bioengineering)."
          - 'Built end-to-end ML code "AtriPINN" (PyTorch): modular Wave and Eikonal and EP-PINNs backends with one shared data → train → viz pipeline.'
          - "Delivered real-time mapping: ~78 ms end-to-end latency, ~1.6 mm RMS localisation error (sub-2 mm target), ≥ 0.99 channel cross-correlation."
          - "Software-engineered time-shifted kNN blending for inter-electrode signals + differentiable cross-correlation objective function for physiologic timing consistency."
          - "Implemented local plane-fit velocity extraction and advection-based velocity fields, and implemented coordinate-agnostic features (Cartesian, cylindrical, spherical) into my code AtriPINN."
          - "Scaled Neural Network training with AMP mixed precision, RAR and adaptive collocation, Adam → L-BFGS optimisation, gradient clipping, and curriculum scheduling."
          - "Shipped v1–v11.2 with CLI tooling, robust logging, and edge-deployment optimisations (GPU memory and throughput)."
          - "Currently producing reproducible releases (configs, sample data, animations) to support clinical translation and benchmarking."
          - "Tech used: Python (PyTorch), NumPy, SciPy, Matplotlib, CUDA/GPU, CLI tooling, Git."

      - company: Imperial College London
