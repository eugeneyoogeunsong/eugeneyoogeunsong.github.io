        end_date: 2025-09
        highlights:
          - "Completed my Master's studies at the Department of Physics at Imperial College London, which has recently been ranked #2 globally in the QS World University Rankings 2025 and 2026."
          - "Led a 3-month (Jan–Mar 2025) advanced literature review (Grade: A) under the supervision of Prof. Alexander Tapper (Imperial HEP group) on Higgs bosons as potential portals to dark matter; critically analysed high-impact ATLAS and CMS collaboration papers to map current research frontiers."
          - "(Mar–Apr 2025) Built an interactive simulation framework (Grade: A) in Wolfram Mathematica to model time-dependent quantum wave dynamics using finite-difference time-domain methods, as part of a numerics-intensive physics module taught and assessed by Dr. Jaroslaw Pasternak (Imperial HEP group)."
          - 'My MSc Project Thesis titled "Physics-Informed Machine Learning for Real-Time Afib Mapping on Grid Electrograms" was awarded the highest grade.'

